# ============================================================
# TEST CONFIGURATION
# This file is used ONLY when running tests.
# It overrides the main application.properties.
# ============================================================

# H2 is an in-memory database — perfect for tests
# No MySQL installation needed to run tests!
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable SQL logging in tests to keep output clean
spring.jpa.show-sql=false
